<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel ADM - EPALI</title>
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <!-- CABEÇALHO GLOBAL -->
    <header class="main-header">
      <h2>Portal EPALI</h2>
      <a
        href="/index.html"
        style="color: white; text-decoration: none; font-weight: bold"
        >Voltar ao Site</a
      >
    </header>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
      <div class="login-box">
        <h2 style="color: #0033a0">Acesso Restrito</h2>
        <p>Insira seu e-mail da comissão para acessar:</p>
        <input
          type="email"
          id="email-input"
          placeholder="seuemail@exemplo.com"
        />
        <br />
        <button onclick="verificarAcesso()">Entrar</button>
        <p id="erro-login" style="color: red; display: none; margin-top: 10px">
          E-mail não autorizado.
        </p>
      </div>
    </div>

    <!-- PAINEL ADMINISTRATIVO -->
    <div id="admin-content">
      <div class="admin-header-controls">
        <h1 class="admin-title">Painel de Documentos</h1>

        <div class="filter-group">
          <!-- Filtro de Unidades baseado nas pastas do Supabase -->
          <select
            id="unit-filter"
            class="filter-select"
            onchange="filtrarDocumentos()"
          >
            <option value="todas">Todas as Unidades</option>
            <option value="Alphaville">Alphaville</option>
            <option value="Centro">Centro</option>
            <option value="Guarulhos">Guarulhos</option>
            <option value="Itaquera">Itaquera</option>
            <option value="Lapa">Lapa</option>
            <option value="Norte">Norte</option>
            <option value="Osasco">Osasco</option>
            <option value="Ribeirao_Preto">Ribeirão Preto</option>
            <option value="Santo_Amaro">Santo Amaro</option>
            <option value="Sao_Jose_dos_Campos">São José dos Campos</option>
          </select>

          <!-- Barra de Pesquisa por nome -->
          <input
            type="text"
            id="search-input"
            class="search-bar"
            onkeyup="filtrarDocumentos()"
            placeholder="Pesquisar por nome do jovem..."
          />
        </div>
      </div>

      <div class="grid-container">
        <div class="list-section">
          <h2>Autorização de Imagem</h2>
          <ul class="doc-list" id="lista-imagem"></ul>
        </div>

        <div class="list-section">
          <h2>Autorização de Menor</h2>
          <ul class="doc-list" id="lista-menor"></ul>
        </div>
      </div>
    </div>

    <script>
      const emailsPermitidos = [
        "amanda.areas@uol.com.br",
        "biachinellato@gmail.com",
        "carloslopesprofi@gmail.com",
        "catharina.tognetti@gmail.com",
        "danilo.oliveiraconceicao28@gmail.com",
        "heitornorilla@gmail.com",
        "helocontibelo@gmail.com",
        "henrique.santos.alencar@usp.br",
        "isatoschi13@gmail.com",
        "joao.custodio1309@gmail.com",
        "juliapereiravita2006@gmail.com",
        "laura.s.sanches2006@gmail.com",
        "luizamabtum@icloud.com",
        "manuellamoraes14@gmail.com",
        "marisolthesun@gmail.com",
        "tangstabile@gmail.com",
        "viniciusc.ferri@gmail.com",
        "dasouza51@gmail.com",
        "feliperocha07@gmail.com",
      ];

      function verificarAcesso() {
        const emailDigitado = document
          .getElementById("email-input")
          .value.trim()
          .toLowerCase();
        if (emailsPermitidos.includes(emailDigitado)) {
          document.getElementById("login-screen").style.display = "none";
          document.getElementById("admin-content").style.display = "block";

          carregarDocumentos();
        } else {
          document.getElementById("erro-login").style.display = "block";
        }
      }

      async function carregarDocumentos() {
        try {
          const resposta = await fetch("/api/documentos/listar-todos");
          const arquivos = await resposta.json();

          const listaImagem = document.getElementById("lista-imagem");
          const listaMenor = document.getElementById("lista-menor");

          listaImagem.innerHTML = "";
          listaMenor.innerHTML = "";

          let qtdImagem = 0;
          let qtdMenor = 0;

          if (arquivos && arquivos.length > 0) {
            arquivos.forEach((arquivo) => {
              const nomeCompleto = arquivo.name;

              if (!nomeCompleto || !nomeCompleto.includes(".pdf")) return;

              const partes = nomeCompleto.split("/");
              const nomeArquivo = partes[partes.length - 1];
              const unidade = partes.length > 1 ? partes[0] : "Documento Salvo";
              const isImagem = nomeArquivo.includes("IMAGEM");

              let nomeJovem = nomeArquivo
                .replace("Autorizacao_IMAGEM_", "")
                .replace("Autorizacao_MENOR_", "")
                .replace(".pdf", "")
                .replaceAll("_", " ");

              const itemHTML = `
                            <li class="doc-item">
                                <div class="doc-info">
                                    <span class="doc-name">${nomeJovem}</span>
                                    <span class="doc-unit">${unidade}</span>
                                </div>
                                <span class="${isImagem ? "tag-imagem" : "tag-menor"}">
                                    ${isImagem ? "IMAGEM" : "MENOR"}
                                </span>
                            </li>
                        `;

              if (isImagem) {
                listaImagem.innerHTML += itemHTML;
                qtdImagem++;
              } else {
                listaMenor.innerHTML += itemHTML;
                qtdMenor++;
              }
            });
          }

          const mensagemVazio = `<li style="padding: 20px; text-align: center; color: #777; font-style: italic;">Ainda não foram preenchidos nenhum documento</li>`;

          if (qtdImagem === 0) listaImagem.innerHTML = mensagemVazio;
          if (qtdMenor === 0) listaMenor.innerHTML = mensagemVazio;
        } catch (erro) {
          console.error("Erro ao carregar documentos:", erro);
          alert("Falha ao carregar a lista de documentos.");
        }
      }

      // FUNÇÃO DE FILTRO ATUALIZADA (Cruza o texto digitado com a unidade escolhida)
      function filtrarDocumentos() {
        const termo = document
          .getElementById("search-input")
          .value.toLowerCase();
        const unidadeSelecionada = document.getElementById("unit-filter").value;
        const itens = document.querySelectorAll(".doc-item");

        itens.forEach((item) => {
          const nomeItem = item
            .querySelector(".doc-name")
            .innerText.toLowerCase();
          const unidadeItem = item.querySelector(".doc-unit").innerText;

          // Verifica se o texto bate
          const correspondeNome = nomeItem.includes(termo);

          // Verifica se a unidade bate (ou se a opção "Todas" está marcada)
          const correspondeUnidade =
            unidadeSelecionada === "todas" ||
            unidadeItem === unidadeSelecionada;

          // Só mostra se passar nos dois testes
          if (correspondeNome && correspondeUnidade) {
            item.style.display = "flex";
          } else {
            item.style.display = "none";
          }
        });
      }
    </script>
  </body>
</html>
